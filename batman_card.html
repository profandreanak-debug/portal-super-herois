<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Herói - Batman</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(145deg, #161b22, #0d1117);
            border: 2px solid #58a6ff;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
            width: 350px;
            padding: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.4);
        }
        .profile-container {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        /* Criando o símbolo do morcego puramente em CSS para não falhar */
        .bat-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            background-color: #111;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }
        h1 {
            color: #ffffff;
            margin: 10px 0 5px 0;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .subtitle {
            color: #58a6ff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .info-group {
            text-align: left;
            border-top: 1px solid #21262d;
            padding-top: 15px;
        }
        .info-item {
            margin-bottom: 12px;
            font-size: 15px;
        }
        .info-label {
            color: #8b949e;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }
        .info-value {
            color: #f0f6fc;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 5px;
        }
        .tag {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-container">
            <!-- Usando um caractere universal de morcego estilizado via CSS -->
            <div class="bat-icon">🦇</div>
        </div>
        
        <h1>BATMAN</h1>
        <div class="subtitle">O Cavaleiro das Trevas</div>
        
        <div class="info-group">
            <div class="info-item">
                <span class="info-label">Identidade Secreta</span>
                <span class="info-value">Bruce Wayne</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">Base de Operações</span>
                <span class="info-value">Gotham City</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">Primeira Aparição</span>
                <span class="info-value">Detective Comics #27 (1939)</span>
            </div>
            
            <div class="info-item">
                <span class="info-label">Habilidades</span>
                <div class="tags">
                    <span class="tag">Mestre Marcial</span>
                    <span class="tag">Intelecto Genial</span>
                    <span class="tag">Detetive</span>
                    <span class="tag">Tecnologia</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
