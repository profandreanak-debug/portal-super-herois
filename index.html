<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Super-Heróis 🚀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #e94560;
            font-size: 2.5rem;
        }

        p {
            color: #0f3460;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 400px;
            margin: 0 auto;
        }

        li {
            background-color: #16213e;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            transition: transform 0.2s;
        }

        li:hover {
            transform: scale(1.05);
            border-color: #e94560;
        }

        a {
            color: #4ecc71;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
        }
    </style>
</head>
