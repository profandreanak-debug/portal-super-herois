        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0 auto;
        }
        li {
            background-color: #16213e;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            transition: transform 0.2s;
        }
        li:hover {
            transform: scale(1.05);
            border-color: #e94560;
        }
        a {
            color: #4ecc71;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
        }
