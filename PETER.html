<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Super-Herói</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        .heroi {

        .cabeca {

        .cabelo {
